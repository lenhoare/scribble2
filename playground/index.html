<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scribble Playground</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside id="controls">
      <h1>scribble</h1>
      <section>
        <label>Hand code
          <div class="row">
            <input id="code" spellcheck="false" />
            <button id="copy" title="Copy">Copy</button>
          </div>
        </label>
        <div class="row">
          <button id="random">Random hand</button>
          <label class="inline">Seed <input id="seed" type="number" min="0" /></label>
        </div>
        <label>Skeleton <select id="skeleton"></select></label>
      </section>
      <section>
        <h2>View</h2>
        <label>Mess <output id="messOut"></output><input id="mess" type="range" min="0" max="2" step="0.01" value="1" /></label>
        <label>Size (x-height px) <output id="sizeOut"></output><input id="size" type="range" min="6" max="60" step="1" value="22" /></label>
        <label>Renderer
          <select id="renderer"><option value="svg">SVG</option><option value="canvas">Canvas</option></select>
        </label>
      </section>
      <div id="params"></div>
    </aside>
    <main>
      <textarea id="text" rows="3" spellcheck="false">Sphinx of black quartz, judge my vow.
The quick brown fox jumps over the lazy dog — and then does it again, slightly more tired than before.</textarea>
      <div class="card"><div id="out"></div></div>
      <div id="perf"></div>
      <h2>Other hands <small>(click to use)</small> <button id="more">Shuffle</button></h2>
      <div id="gallery"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
